# PS3 Platform Configuration

# Set compilers to PS3Toolchain compilers
CC = ppu-gcc
CXX = ppu-g++
# Use the PS3 toolchain's strip utility
STRIP = ppu-strip

# Set PKG_CONFIG_PATH for SDL2PSL1GHT and other libraries
export PKG_CONFIG_PATH := $(PS3DEV)/portlibs/ppu/lib/pkgconfig:$(PKG_CONFIG_PATH)

# Add PS3-specific libraries
LIBS += -lio -laudio -lsysmodule -lsysutil -lnet -lnetctl -lgcm_sys -lrsx -lcamera -lfreetype -lpng -lz -lm

# Library Search Paths for PS3
LDFLAGS += -L$(PSL1GHT)/lib
LDFLAGS += -L/usr/local/ps3dev/ppu/powerpc64-ps3-elf/lib
LDFLAGS += -L$(PS3DEV)/ppu/lib # Fallback, some SDKs might use this path directly

# Add any PS3-specific compiler flags if needed
# CFLAGS += -DSOME_PS3_DEFINE

# Define PS3 preprocessor macro for conditional compilation
CFLAGS += -DPS3
CXXFLAGS += -DPS3

# Asio POSIX compatibility flags
ASIO_FLAGS = -D_POSIX_VERSION=200809L \
             -DASIO_HAS_PTHREADS \
             -DASIO_HAS_STD_ADDRESSOF \
             -DASIO_HAS_STD_ARRAY \
             -DASIO_HAS_STD_SHARED_PTR \
             -DASIO_HAS_STD_TYPE_TRAITS \
             -DASIO_DISABLE_VISIBILITY \
             -DASIO_HAS_FCNTL

CFLAGS += $(ASIO_FLAGS)
CXXFLAGS += $(ASIO_FLAGS)

# Disable networking for PS3 build
CFLAGS += -DPS3_DISABLE_NETWORKING
CXXFLAGS += -DPS3_DISABLE_NETWORKING
